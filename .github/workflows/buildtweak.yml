name: Build FBTweak (rootless, SDK 26.2)

on:
  push:
    branches:
      - 'flags'
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FBTweak (rootless)
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      SDK_NAME: iPhoneOS26.2.sdk
      OUTPUT_BASENAME: FBTweak.1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: Test Python suite and employee getter persistence
        run: |
          cd main
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Install Dependencies
        run: brew install ldid dpkg make

      - name: Set PATH (GNU make)
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v4
        env:
          cache-name: iPhoneOS26.2.sdk
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone "$SDK_NAME"
          git checkout
          mkdir -p "$THEOS/sdks"
          mv *.sdk "$THEOS/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Validate
        run: |
          cd main
          chmod +x scripts/*.sh build.sh || true
          scripts/validate-sdk26.sh
          test -d "$THEOS/sdks/$SDK_NAME"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Test Native Live Trace (portable collector + integration)
        run: |
          cd main
          clang++ -std=c++11 -pthread -Wall -Wextra -Werror tests/NativeTraceCoreTests.cpp -o /tmp/fbt-native-trace-tests
          /tmp/fbt-native-trace-tests
          python3 -m unittest discover -s tests -p "test_native_trace_contract.py" -v

      - name: Test safe hook bootstrap and single-owner contract
        run: |
          cd main
          python3 -m unittest discover -s tests -p "test_safe_hook_bootstrap.py" -v
          python3 -m unittest discover -s tests -p "test_mobile_lab_bootstrap.py" -v
          python3 -m unittest discover -s tests -p "test_hook_ownership.py" -v

      - name: Test runtime BOOL persistence and employee sweep cleanup
        run: |
          cd main
          python3 -m unittest discover -s tests -p "test_runtime_bool_contract.py" -v

      - name: Test override file preservation
        run: |
          cd main
          clang -fobjc-arc -framework Foundation tests/MCOverridesFileTests.m src/Runtime/FBTMCOverridesFile.m -o /tmp/fbt-mc-file-tests
          /tmp/fbt-mc-file-tests

      - name: Test scoped request experiment and employee observations
        run: |
          cd main
          clang++ -std=c++11 -pthread tests/RequestExperimentTests.cpp -o /tmp/fbt-request-experiment-tests
          /tmp/fbt-request-experiment-tests
          clang -fobjc-arc -Wno-incomplete-implementation -framework Foundation tests/EmployeeDiagnosticsTests.m -o /tmp/fbt-employee-tests
          /tmp/fbt-employee-tests

      - name: Test session-only native MobileConfig probe safety
        run: |
          cd main
          python3 -m unittest discover -s tests -p "test_mc_native_session_probes.py" -v
          python3 -m unittest discover -s tests -p "test_mc_readonly_source_contract.py" -v

      - name: Test native probe session lifecycle and link isolation
        run: |
          cd main
          clang -std=c11 -fobjc-arc -c tests/MCNativeSessionProbeTests.m -o /tmp/fbt-mc-probe-tests.o
          clang++ -std=c++11 -fobjc-arc -c tests/MCNativeProbeLinkTests.mm -o /tmp/fbt-mc-probe-link-tests.o
          clang++ -framework Foundation /tmp/fbt-mc-probe-tests.o /tmp/fbt-mc-probe-link-tests.o -o /tmp/fbt-mc-probe-tests
          /tmp/fbt-mc-probe-tests

      - name: Test QE diagnostics safe mode crash containment
        run: |
          cd main
          python3 -m unittest discover -s tests -p "test_qe_safe_diagnostics.py" -v
          if grep -En 'FBT_ENABLE_QE_INVASIVE_HOOKS[[:space:]]*=[[:space:]]*1|-DFBT_ENABLE_QE_INVASIVE_HOOKS=1' Makefile build.sh; then
            echo 'Unsafe QE invasive hooks enabled in default sideload build' >&2
            exit 1
          fi

      - name: Test Tigon error response capture
        run: |
          cd main
          clang -std=c11 -fobjc-arc -framework Foundation -c src/Runtime/FBTNetworkInspectorStore.m -o /tmp/fbt-inspector-store.o
          clang++ -std=c++11 -fobjc-arc -Wno-incomplete-implementation -framework Foundation -framework QuartzCore tests/TigonCaptureTests.mm /tmp/fbt-inspector-store.o -lz -o /tmp/fbt-tigon-tests
          /tmp/fbt-tigon-tests

      - name: Test native query correlation
        run: |
          cd main
          clang -fobjc-arc -framework Foundation tests/QueryContextTests.m src/Runtime/FBTMobileConfigQueryContext.m -o /tmp/fbt-query-tests
          /tmp/fbt-query-tests

      - name: Test on-device Network Inspector and request/callback correlation
        run: |
          cd main
          python3 -m unittest discover -s tests -p "test_network_inspector_contract.py" -v
          python3 -m unittest discover -s tests -p "test_network_inspector_adaptive_hooks.py" -v
          clang -std=c11 -fobjc-arc -framework Foundation tests/NetworkInspectorStoreTests.m src/Runtime/FBTNetworkInspectorStore.m -o /tmp/fbt-network-inspector-tests
          /tmp/fbt-network-inspector-tests

      - name: Test on-device names diagnostics decoding
        run: |
          cd main
          clang -fobjc-arc -framework Foundation tests/NamesResponseSummaryTests.m src/Runtime/FBTNamesResponseSummary.m -lz -o /tmp/fbt-names-tests
          /tmp/fbt-names-tests

      - name: Test native SYS and effective value inspection
        run: |
          cd main
          clang -fobjc-arc -Wno-incomplete-implementation -Wl,-export_dynamic -framework Foundation tests/MobileConfigValueReaderTests.m src/Runtime/FBTMobileConfigValueReader.m -o /tmp/fbt-value-tests
          /tmp/fbt-value-tests

      - name: Test compiled descriptor and map validation
        run: |
          cd main
          clang -fobjc-arc -Wno-incomplete-implementation -Wl,-export_dynamic -framework Foundation tests/LocalConfigDescriptorTests.m src/Runtime/FBTLocalConfigCatalog.m -lz -o /tmp/fbt-descriptor-tests
          /tmp/fbt-descriptor-tests

      - name: Validate safe dynamic hooking architecture
        run: |
          cd main
          python3 scripts/validate_hook_architecture.py

      - name: Build rootless
        run: |
          cd main
          ./build.sh rootless
          mkdir -p release
          DEB="$(ls -t packages/*.deb 2>/dev/null | head -n1)"
          test -n "$DEB"
          cp "$DEB" "release/${OUTPUT_BASENAME}.deb"
          ls -la release
          bash scripts/verify_macho_installation.sh "$DEB"
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE: lzma
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL: 9

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FBTweak.1.0.${{ github.run_number }}
          path: main/release/FBTweak.1.0.${{ github.run_number }}.deb
          if-no-files-found: error



