name: Build FBTweaks
on:
  push:
    branches: [main, experiments]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - run: chmod +x build.sh build-fast.sh scripts/*.sh scripts/*.py || true
      - run: brew install ldid dpkg make
      - run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive
      - name: Cache SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: iPhoneOS26.2-or-26.0.sdk
      - name: Download SDK 26.2 or fallback 26.0
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          if git sparse-checkout set --no-cone iPhoneOS26.2.sdk && git checkout; then
            echo "SDK_VERSION=26.2" >> "$GITHUB_ENV"
          else
            git reset --hard
            git sparse-checkout set --no-cone iPhoneOS26.0.sdk
            git checkout
            echo "SDK_VERSION=26.0" >> "$GITHUB_ENV"
          fi
          mv *.sdk "$THEOS/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos
      - name: Detect cached SDK
        run: |
          if [ -d "$THEOS/sdks/iPhoneOS26.2.sdk" ]; then echo "SDK_VERSION=26.2" >> "$GITHUB_ENV"; else echo "SDK_VERSION=26.0" >> "$GITHUB_ENV"; fi
        env:
          THEOS: ${{ github.workspace }}/theos
      - name: Adapt Makefile if SDK fallback is 26.0
        run: |
          if [ "$SDK_VERSION" = "26.0" ]; then
            sed -i '' 's/26\.2/26.0/g; s/iPhoneOS26\.2\.sdk/iPhoneOS26.0.sdk/g' Makefile scripts/fbt_validate_sources.py scripts/validate-sdk26-liquidglass.sh
          fi
      - run: ./scripts/validate-sdk26-liquidglass.sh
        env:
          THEOS: ${{ github.workspace }}/theos
      - run: python3 scripts/fbt_validate_sources.py
      - name: Build package
        run: |
          export THEOS="${{ github.workspace }}/theos"
          ./build.sh rootless
          RUN_PAD=$(printf "%03d" "$GITHUB_RUN_NUMBER")
          DEB_NAME="FBTweaks-0.1.${RUN_PAD}.deb"
          SRC_DEB="$(ls -t packages/*.deb | head -n1)"
          mv "$SRC_DEB" "packages/$DEB_NAME"
          echo "DEB_NAME=$DEB_NAME" >> "$GITHUB_ENV"
          ls -la packages
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: packages/${{ env.DEB_NAME }}
          if-no-files-found: error
