name: Build FBTweaks tweak (rootless only)

on:
  push:
    branches:
      - main
      - experiments
      - experimental
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FBTweaks
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          path: main
          submodules: recursive
          fetch-depth: 0

      - name: Normalize script permissions
        run: |
          cd main
          chmod +x ./build.sh ./build-fast.sh || true
          find scripts -name "*.sh" -exec chmod +x {} \; || true

      - name: Install Dependencies
        run: brew install ldid dpkg make

      - name: Set PATH environment variable
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v4
        env:
          cache-name: iPhoneOS26.0.sdk
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS26.0.sdk
          git checkout
          mv *.sdk "$THEOS/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Validate SDK 26 headers
        run: cd main && ./scripts/validate-sdk26-fbtweaks.sh
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Validate sources
        run: cd main && python3 scripts/fbt_validate_sources.py

      - name: Get Version
        id: version
        run: |
          VERSION=$(awk '/Version:/ {print $2}' main/control)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build rootless (fail early if missing)
        run: |
          set -euo pipefail
          cd main
          echo "Starting rootless build..."
          ./build.sh rootless
          cd packages
          echo "Packages dir: $(pwd)"
          ls -la
          DEB="$(ls -t *rootless*.deb *.deb 2>/dev/null | head -n1 || true)"
          if [ -z "${DEB}" ]; then
            echo "ERROR: No rootless .deb file found after build!"
            ls -la
            exit 1
          fi
          mv "${DEB}" "com.darthplagueiswise.fbtweaks_${VERSION}+debug-rootless.deb"
          echo "Renamed ${DEB} to com.darthplagueiswise.fbtweaks_${VERSION}+debug-rootless.deb"
          ls -la
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Upload rootless artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.darthplagueiswise.fbtweaks_${{ env.VERSION }}+debug-rootless.deb
          path: ${{ github.workspace }}/main/packages/com.darthplagueiswise.fbtweaks_${{ env.VERSION }}+debug-rootless.deb
          if-no-files-found: error
