name: Build FBTweaks
on:
  push:
    branches: [main, experiments, experimental]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - run: chmod +x build.sh build-fast.sh scripts/*.sh scripts/*.py || true
      - run: brew install ldid dpkg make
      - run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive
      - uses: actions/cache@v4
        id: sdk
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: iPhoneOS26.2.sdk
          restore-keys: iPhoneOS26.2.sdk
      - if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS26.2.sdk
          git checkout
          mv *.sdk "$THEOS/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos
      - run: ./scripts/validate-sdk26-liquidglass.sh
        env:
          THEOS: ${{ github.workspace }}/theos
          SDK_VERSION: "26.2"
      - run: python3 scripts/fbt_validate_sources.py
      - run: |
          export THEOS="${{ github.workspace }}/theos"
          ./build.sh rootless
          test -n "$(ls packages/*.deb 2>/dev/null)" || { echo "ERROR: no deb generated"; exit 1; }
          ls -la packages
      - uses: actions/upload-artifact@v4
        with:
          name: FBTweaks-rootless
          path: packages/*.deb
          if-no-files-found: error
