name: Build FBTweak (rootless, SDK 26.2)

on:
  push:
    branches:
      - 'flags'
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FBTweak (rootless)
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      SDK_NAME: iPhoneOS26.2.sdk
      OUTPUT_BASENAME: FBTweak.1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: Install Dependencies
        run: brew install ldid dpkg make

      - name: Set PATH (GNU make)
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v4
        env:
          cache-name: iPhoneOS26.2.sdk
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone "$SDK_NAME"
          git checkout
          mkdir -p "$THEOS/sdks"
          mv *.sdk "$THEOS/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Validate
        run: |
          cd main
          chmod +x scripts/*.sh build.sh || true
          scripts/validate-sdk26.sh
          test -d "$THEOS/sdks/$SDK_NAME"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Build rootless
        run: |
          cd main
          ./build.sh rootless
          mkdir -p release
          DEB="$(ls -t packages/*.deb 2>/dev/null | head -n1)"
          test -n "$DEB"
          cp "$DEB" "release/${OUTPUT_BASENAME}.deb"
          ls -la release
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE: lzma
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL: 9

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FBTweak.1.0.${{ github.run_number }}
          path: main/release/FBTweak.1.0.${{ github.run_number }}.deb
          if-no-files-found: error
