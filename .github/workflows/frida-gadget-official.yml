name: Frida Gadget official iPhone binary (laboratory)

on:
  push:
    branches: [flags]
    paths:
      - '.github/workflows/frida-gadget-official.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-gadget:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify upstream Frida Gadget 17.24.3 for iPhone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frida-lab
          VERSION=17.24.3
          NAME="frida-gadget-${VERSION}-ios-universal.dylib.xz"
          SHA256=c896d08e10f3f30a009c5e24dad696e710021de95616e15e0d90d5cf17b5e507
          URL="https://github.com/frida/frida/releases/download/${VERSION}/${NAME}"
          curl --retry 3 --fail --location --silent --show-error "$URL" -o "$NAME"
          echo "$SHA256  $NAME" | shasum -a 256 -c -
          xz -dc "$NAME" > frida-lab/FridaGadget.dylib
          file frida-lab/FridaGadget.dylib
          lipo -info frida-lab/FridaGadget.dylib
          lipo -archs frida-lab/FridaGadget.dylib | grep -qw arm64
          # Controlled diagnostic only: arm64 thin slice of the verified official asset.
          mkdir -p frida-lab-arm64
          lipo -thin arm64 frida-lab/FridaGadget.dylib -output frida-lab-arm64/FridaGadget.dylib
          lipo -archs frida-lab-arm64/FridaGadget.dylib | grep -qx arm64
          cat > frida-lab/FridaGadget.config <<'EOF'
          {
            "interaction": {
              "type": "listen",
              "address": "127.0.0.1",
              "port": 27042,
              "on_port_conflict": "pick-next",
              "on_load": "resume"
            },
            "code_signing": "required"
          }
          EOF
          cat > frida-lab/manifest.txt <<EOF
          Source: $URL
          Asset SHA256: $SHA256
          Binary SHA256: $(shasum -a 256 frida-lab/FridaGadget.dylib | awk '{print $1}')
          Version: $VERSION
          Platform: iOS physical device (arm64)
          Note: laboratory only, not signed; re-sign IPA, nested dylib and provision.
          EOF
          cp frida-lab/FridaGadget.config frida-lab-arm64/FridaGadget.config
          cat > frida-lab-arm64/manifest.txt <<EOF
          Source: official 17.24.3 iOS Universal, thinned via lipo
          Arm64-only SHA256: $(shasum -a 256 frida-lab-arm64/FridaGadget.dylib | awk '{print $1}')
          Warning: diagnostic experiment, not a proven workaround for Frida issue 3770
          EOF
          cat frida-lab/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FridaGadget-official-ios-17.24.3
          path: frida-lab/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: FridaGadget-ios-arm64-only-lab-17.24.3
          path: frida-lab-arm64/
          if-no-files-found: error
          retention-days: 7
