name: Install and verify Capstone ARM64 for Instagram RE

on:
  push:
    branches:
      - tools/capstone-instagram-20261101
    paths:
      - .github/workflows/capstone-install.yml
      - tools/instagram_re/verify_ig453_bl_words.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capstone-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Capstone via pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade capstone
      - name: Confirm imported extension and disassemble ARM64
        run: |
          python - <<'PY'
          import capstone, json, sys, platform
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN
          code = bytes.fromhex("1f2003d5c0035fd6")
          decoder = Cs(CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN)
          decoded = list(decoder.disasm(code, 0x1000))
          rows = [{"address": hex(i.address), "mnemonic": i.mnemonic, "operands": i.op_str} for i in decoded]
          assert [x["mnemonic"] for x in rows] == ["nop", "ret"], rows
          data = {
              "installed": True,
              "capstone_version": capstone.__version__,
              "python_version": platform.python_version(),
              "platform": platform.platform(),
              "architecture": "ARM64",
              "instructions": rows,
              "scope": "GitHub Actions ephemeral runner; not ChatGPT local container",
              "instagram_binary_analyzed": False
          }
          with open("capstone_install_verification.json","w") as f:
              json.dump(data, f, indent=2)
          print(json.dumps(data, indent=2))
          PY
      - name: Verify extracted Instagram 453 BL instruction words with Capstone
        run: python tools/instagram_re/verify_ig453_bl_words.py
      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: capstone-arm64-verification
          path: |
            capstone_install_verification.json
            ig453_capstone_verified_xrefs.json
