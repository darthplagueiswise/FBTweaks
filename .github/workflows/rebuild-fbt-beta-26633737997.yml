name: Rebuild FBTweaks beta #40 (26633737997)
on:
  push:
    branches:
      - rebuild/fbt-beta-run40-26633737997

permissions:
  contents: read

jobs:
  build:
    name: Rebuild beta #40
    runs-on: macos-latest
    steps:
      - name: Checkout exact original beta source
        uses: actions/checkout@v4
        with:
          ref: 0ece75d4e6a2aa9221614b3a0cf4ee90a4a4c067
          submodules: recursive
          fetch-depth: 0
      - name: Verify original commit and normalize permissions
        run: |
          test "$(git rev-parse HEAD)" = "0ece75d4e6a2aa9221614b3a0cf4ee90a4a4c067"
          chmod +x ./build.sh || true
          find . -name "*.sh" -exec chmod +x {} \; || true
      - name: Install dependencies
        run: brew install ldid dpkg make
      - name: Use GNU make
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive
      - name: Cache iOS 16.2 SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: iPhoneOS16.2.sdk
      - name: Download iOS 16.2 SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS16.2.sdk
          git checkout
          mkdir -p "$THEOS/sdks"
          mv *.sdk "$THEOS/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos
      - name: Keep historical beta #40 package version
        run: |
          test -d "$THEOS/sdks/iPhoneOS16.2.sdk"
          grep -q '^Version: 3.1.0$' control
          sed -i '' 's/^Version:.*/Version: 3.1.0.40/' control
        env:
          THEOS: ${{ github.workspace }}/theos
      - name: Build original source
        run: |
          export THEOS="${{ github.workspace }}/theos"
          bash ./build.sh
          mkdir -p release
          DEB="$(ls -t packages/*.deb 2>/dev/null | head -n1)"
          test -f "$DEB"
          cp "$DEB" release/FBTweaks_beta_3.1.0_40.deb
          shasum -a 256 release/FBTweaks_beta_3.1.0_40.deb | tee release/SHA256SUMS.txt
      - name: Upload historical beta #40 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FBTweaks_beta_v3.1.0_40_rebuild-26633737997
          path: release/
          retention-days: 90
          if-no-files-found: error
